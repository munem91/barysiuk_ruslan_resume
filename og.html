<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=1200">
<title>OG image source</title>
<!-- Source of og.png (1200x630). Render: open at 1200x630 and screenshot. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Manrope:wght@700;800&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:#0A0D14}
  body{position:relative;font-family:Inter,system-ui,sans-serif;color:#E6EAF2;-webkit-font-smoothing:antialiased}
  .glow{position:absolute;left:640px;top:-120px;width:760px;height:760px;border-radius:50%;background:radial-gradient(closest-side,#18223D 0,#121A2E 45%,rgba(10,13,20,0) 100%)}
  .rule{position:absolute;left:72px;right:72px;bottom:0;height:1px;background:#1C2333}
  .copy{position:absolute;left:72px;top:64px;width:560px}
  .ava{position:relative;width:120px;height:120px;padding:6px;border-radius:50%;background:#0A0D14;box-shadow:inset 0 0 0 2.5px rgba(180,200,255,.7)}
  .ava img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 35%}
  .ava i{position:absolute;right:7px;bottom:7px;width:22px;height:22px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 5px #0A0D14}
  h1{margin-top:34px;font:800 76px/.95 Manrope,sans-serif;letter-spacing:-.045em}
  .ru{margin-top:14px;font:700 30px/1.1 Manrope,sans-serif;letter-spacing:-.015em;color:#8792A8}
  .role{margin-top:34px;font:800 38px/1.05 Manrope,sans-serif;letter-spacing:-.03em;color:#B4C8FF}
  .sub{margin-top:12px;font:500 23px/1.35 Inter,sans-serif;color:#A9B2C4}
  .chip{position:absolute;left:72px;bottom:56px;display:inline-flex;align-items:center;gap:12px;padding:10px 18px 10px 16px;border-radius:999px;border:1px solid #273148;background:#121927;font:500 20px/1 Inter,sans-serif;color:#C9D1E0}
  .chip b{width:10px;height:10px;border-radius:50%;background:#3DDC84;box-shadow:0 0 0 4px rgba(61,220,132,.18)}
  .ph{position:absolute;width:var(--w);aspect-ratio:9/19.5;padding:calc(var(--w)*.035);border-radius:calc(var(--w)*.165);background:#000;box-shadow:0 0 0 1.5px rgba(180,200,255,.2),inset 0 0 0 1px rgba(255,255,255,.1),0 30px 60px -20px rgba(0,0,0,.85)}
  .ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 0;border-radius:calc(var(--w)*.13)}
  .ph::before{content:"";position:absolute;left:50%;top:calc(var(--w)*.06);width:calc(var(--w)*.29);height:calc(var(--w)*.085);transform:translateX(-50%);border-radius:99px;background:#000}
  .p1{--w:236px;left:700px;top:118px;transform:rotate(-8deg)}
  .p3{--w:236px;left:948px;top:118px;transform:rotate(8deg)}
  .p2{--w:262px;left:810px;top:58px;z-index:2}
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="copy">
    <div class="ava"><img src="img/ava_wb.jpg" alt=""><i></i></div>
    <h1>Ruslan Barysiuk</h1>
    <p class="ru">Руслан Борисюк</p>
    <p class="role">Senior Flutter Developer</p>
    <p class="sub">iOS &amp; Android · Swift · Kotlin · 6 apps in the stores</p>
  </div>
  <p class="chip"><b></b>Open to offers · remote · GMT+7</p>
  <div class="ph p1"><img src="img/h4u_insights.jpg" alt=""></div>
  <div class="ph p3"><img src="img/h4u_paywall.jpg" alt=""></div>
  <div class="ph p2"><img src="img/pu_home.jpg" alt=""></div>
  <div class="rule"></div>
</body>
</html>
