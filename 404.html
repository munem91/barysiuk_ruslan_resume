<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 — Руслан Борисюк / Ruslan Barysiuk</title>
<script>(function(){var d=document.documentElement,s={},t;try{s=JSON.parse(localStorage.getItem("rb-prefs"))||{}}catch(e){}t=s.theme;if(t!=="light"&&t!=="dark")t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";d.setAttribute("data-theme",t)})();</script>
<link rel="icon" href="/barysiuk_ruslan_resume/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@800&display=swap">
<style>
  :root{--bg:#FFFFFF;--line:#E3E8F0;--text:#0E1525;--text-2:#475569;--accent:#22315E;--ink:#FFFFFF;--focus:#2C4FC7;color-scheme:light}
  :root[data-theme="dark"]{--bg:#0A0D14;--line:#1C2333;--text:#E6EAF2;--text-2:#A9B2C4;--accent:#B4C8FF;--ink:#0A0D14;--focus:#8FB0FF;color-scheme:dark}
  *{box-sizing:border-box;margin:0}
  html{background:var(--bg)}
  body{min-height:100vh;display:grid;place-items:center;padding:32px 20px;background:var(--bg);color:var(--text);font:400 16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  main{width:100%;max-width:560px}
  .code{font:800 clamp(96px,26vw,180px)/.85 Manrope,Inter,sans-serif;letter-spacing:-.06em;color:var(--accent)}
  .rule{height:1px;margin:32px 0 24px;background:var(--line)}
  h1{font:800 clamp(26px,5vw,34px)/1.1 Manrope,Inter,sans-serif;letter-spacing:-.03em}
  p{margin-top:10px;color:var(--text-2)}
  p+p{margin-top:2px}
  .btn{display:inline-flex;align-items:center;gap:10px;min-height:50px;margin-top:28px;padding:0 22px;border-radius:999px;background:var(--accent);color:var(--ink);font:600 15.5px/1 Inter,sans-serif;text-decoration:none}
  .btn:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
  svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<main>
  <p class="code" aria-hidden="true">404</p>
  <div class="rule"></div>
  <h1>Страница не найдена</h1>
  <p>Ссылка устарела или в адресе опечатка. Резюме, PDF и контакты — на главной.</p>
  <p lang="en">Page not found. The resume, PDFs and contacts are on the home page.</p>
  <a class="btn" id="home" href="./"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5.5"/><path d="m11 6-6 6 6 6"/></svg>На главную · Home</a>
</main>
<script>(function(){var a=document.getElementById("home"),p=location.pathname.split("/").filter(Boolean);if(/\.github\.io$/.test(location.hostname)&&p.length)a.href="/"+p[0]+"/";else if(location.protocol!=="file:")a.href="/"})();</script>
</body>
</html>
